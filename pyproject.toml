[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "libremapper"
version = "0.1.0"
description = "Federated topology generation for LibreNMS Custom Maps"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Libremapper contributors" }]
maintainers = [{ name = "EchoTechnic" }]
dependencies = [
    "networkx>=3.2,<4",
    "numpy",
    "pydantic>=2.6,<3",
    "PyMySQL>=1.1,<2",
    "PyYAML>=6,<7",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "types-networkx>=3.2,<4",
    "types-PyYAML>=6,<7",
]

[project.scripts]
libremapper = "libremapper.cli:main"
libremapper-api = "libremapper.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/libremapper"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["libremapper"]
strict = true
