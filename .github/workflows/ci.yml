name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python scripts/generate-mcp-schema --check

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 26.10.2
            image: librenms/librenms@sha256:c2208d11f4a9e240dcd763a70b5ba856ae475e26c53675f675e1e346514a6066
          - version: 26.5.1
            image: librenms/librenms@sha256:9e817ca2c2b5f99641fee15e71486ec09bb002cf04726c975fa95a0f50d25d21
    env:
      LIBRENMS_IMAGE: ${{ matrix.image }}
      LIBRENMS_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/plugin-smoke

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        run: |
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml)"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/echotechnic/libremapper
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
